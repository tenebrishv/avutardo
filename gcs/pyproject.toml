[project]
name = "avutardo-gcs"
version = "0.1.0"
description = "Estación terrena del CanSat Avutardo (UTN FRTDF)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyqtgraph>=0.13",
    "pyside6>=6.8",
]

[project.scripts]
avutardo-gcs = "avutardo_gcs:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
