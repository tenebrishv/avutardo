# ============================================================================
#  Formato de telemetría del CanSat Avutardo — versión 1 (issue #10).
#
#  Única fuente del formato: la FSW de la Pico arma el paquete con él y la
#  estación terrena lo decodifica con él. Un campo se cambia acá, nunca en el
#  código.
#
#  Paquete de 61 B, big-endian, campo por campo:
#
#    bytes  0–5   cabecera primaria CCSDS 133.0-B-2, sin cabecera secundaria,
#                 flags de secuencia 11, APID de [cabecera] y tipo TM; su
#                 contador de 14 bits es el contador de secuencia (F1)
#    byte   6     versión del formato (`version`, abajo)
#    bytes  7–58  los campos, en el orden de este archivo
#    bytes 59–60  CRC-16/CCITT-FALSE sobre los bytes 0–58
#
#  Reglas:
#  - Un solo tipo de paquete, a 1 Hz. Cuando el GPS se lee cada 10 s, sus
#    campos repiten el último valor.
#  - Sin dato = centinela: el mínimo del tipo si es con signo, el máximo si es
#    sin signo (255, 65 535…). No lleva clave: sale del tipo.
#  - Los campos nuevos van siempre AL FINAL y la versión sube en 1.
#  - Los parámetros de radio (SF, ancho de banda, preámbulo) no van acá.
# ============================================================================

version = 1

[enlace]
codificacion = "binario"
crc = "CRC-16/CCITT-FALSE"
# Lo que el puente (la Heltec de tierra) le pasa a la notebook por cada paquete:
# el paquete en hexadecimal, el RSSI [dBm] y el SNR [dB].
linea_puente = "<hex>,<rssi>,<snr>\n"

[cabecera]
# El resto de la cabecera lo fija la norma CCSDS y vive en el decodificador.
# El mismo APID para la telemetría y los telecomandos.
apid = 106

# Cada [[campo]] lleva:
#   nombre       identificador del campo (columna del CSV)
#   tipo         uint8 | int16 | uint16 | int32 | uint32
#   divisor      valor físico = entero / divisor (por defecto 1); de él salen
#                los decimales del CSV
#   unidad       SI, o vacía si el campo no tiene unidad
#   requisito    código del Anexo A v2 que lo pide
#   descripcion
# y, opcionales:
#   valores      nombres de los códigos 0, 1, 2… (sólo uint8); un código
#                desconocido se muestra como ?7
#   mostrar      "hora_utc": segundos Unix que se muestran hh:mm:ss y van al
#                CSV en ISO 8601 (2026-11-07T13:48:05Z)
#   reservado    true: viaja en el paquete, pero no se muestra ni va al CSV

[[campo]]
nombre = "estado_fsw"
tipo = "uint8"
unidad = ""
requisito = "G8"
valores = ["BOOT", "STANDBY", "ASCENT", "DESCENT 1", "DESCENT 2", "LANDED"]
descripcion = "Estado del software de vuelo"

[[campo]]
nombre = "hora"
tipo = "uint32"
unidad = "s"
requisito = "F3"
mostrar = "hora_utc"
descripcion = "Hora UTC del CanSat (DS3231), segundos Unix"

[[campo]]
nombre = "tiempo_mision"
tipo = "uint16"
unidad = "s"
requisito = "G3 F2"
descripcion = "Tiempo de misión; persiste a través de reinicios"

[[campo]]
nombre = "altitud"
tipo = "int16"
divisor = 10
unidad = "m"
requisito = "X5 SN1"
descripcion = "Altitud barométrica respecto de la rampa"

[[campo]]
nombre = "presion"
tipo = "uint32"
unidad = "Pa"
requisito = "X5"
descripcion = "Presión atmosférica (BME280)"

[[campo]]
nombre = "temperatura"
tipo = "int16"
divisor = 100
unidad = "°C"
requisito = "X5 SN2"
descripcion = "Temperatura interna (BME280)"

[[campo]]
nombre = "tension"
tipo = "uint16"
divisor = 1000
unidad = "V"
requisito = "SN3 G7"
descripcion = "Tensión del pack (INA226)"

[[campo]]
nombre = "corriente"
tipo = "int16"
divisor = 1000
unidad = "A"
requisito = "SN8 G7"
descripcion = "Corriente del pack (INA226)"

[[campo]]
nombre = "panel"
tipo = "uint16"
divisor = 1000
unidad = "V"
requisito = "X6"
descripcion = "Tensión del panel solar"

[[campo]]
nombre = "acel_x"
tipo = "int16"
divisor = 100
unidad = "m/s²"
requisito = "X5 SN5"
descripcion = "Aceleración, eje x (LSM6DSV32X)"

[[campo]]
nombre = "acel_y"
tipo = "int16"
divisor = 100
unidad = "m/s²"
requisito = "X5 SN5"
descripcion = "Aceleración, eje y (LSM6DSV32X)"

[[campo]]
nombre = "acel_z"
tipo = "int16"
divisor = 100
unidad = "m/s²"
requisito = "X5 SN5"
descripcion = "Aceleración, eje z (LSM6DSV32X)"

[[campo]]
nombre = "rot_x"
tipo = "int16"
divisor = 10
unidad = "°/s"
requisito = "X5 SN5"
descripcion = "Velocidad de rotación, eje x (LSM6DSV32X, ±2000 °/s)"

[[campo]]
nombre = "rot_y"
tipo = "int16"
divisor = 10
unidad = "°/s"
requisito = "X5 SN5"
descripcion = "Velocidad de rotación, eje y (LSM6DSV32X, ±2000 °/s)"

[[campo]]
nombre = "rot_z"
tipo = "int16"
divisor = 10
unidad = "°/s"
requisito = "X5 SN5"
descripcion = "Velocidad de rotación, eje z (LSM6DSV32X, ±2000 °/s)"

[[campo]]
nombre = "gps_hora"
tipo = "uint32"
unidad = "s"
requisito = "SN4"
mostrar = "hora_utc"
descripcion = "Hora UTC del GPS, segundos Unix"

[[campo]]
nombre = "gps_latitud"
tipo = "int32"
divisor = 10_000_000
unidad = "°"
requisito = "X5 SN4"
descripcion = "Latitud, grados decimales (norte positivo)"

[[campo]]
nombre = "gps_longitud"
tipo = "int32"
divisor = 10_000_000
unidad = "°"
requisito = "X5 SN4"
descripcion = "Longitud, grados decimales (este positivo)"

[[campo]]
nombre = "gps_altitud"
tipo = "int32"
divisor = 10
unidad = "m"
requisito = "X5 SN4"
descripcion = "Altitud GPS sobre el nivel del mar"

[[campo]]
nombre = "gps_satelites"
tipo = "uint8"
unidad = ""
requisito = "X5 SN4"
descripcion = "Satélites en uso; 0 es un dato real (sin fix)"

[[campo]]
nombre = "eco_comando"
tipo = "uint16"
unidad = ""
requisito = "G15"
reservado = true
descripcion = "Último telecomando recibido y ejecutado (verificación en tierra)"
